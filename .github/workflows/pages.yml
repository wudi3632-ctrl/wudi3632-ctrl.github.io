name: Publish game build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch compiled game only
        run: |
          mkdir -p public
          for file in index.html index.js index.wasm index.pck index.png index.icon.png index.apple-touch-icon.png; do
            curl -fL --retry 3 -o "public/$file" "https://wudi3632-ctrl.github.io/HERO-LEGEND-demo/$file"
          done
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4

